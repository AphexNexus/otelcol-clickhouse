# .github/workflows/build-collector.yaml
name: Build Custom Collector

on:
  push:
    paths:
      - 'manifest.yaml'
      - '.github/workflows/build-collector.yaml'

jobs:
  build:
    runs-on: arc-runner-set
    steps:
      - name: Checkout code
        uses: actions/checkout@7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@7
        with:
          go-version: '1.25'

      - name: Install OCB
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.163.0

      - name: Build collector
        run: builder --config manifest.yaml

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: justindesilets/otelcol-clickhouse:${{ github.sha }}
