receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # UDP receiver for standard Syslog
  syslog:
    udp:
      listen_address: "0.0.0.0:514"
      async:
        readers: 4
        processors: 4
        max_queue_length: 1000

    protocol: rfc5424
    location: UTC

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [file_log, syslog, otlp]
      processors: [k8s_attributes, batch]
      exporters: [debug]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
