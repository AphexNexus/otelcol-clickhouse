dist:
  name: otelcol-clickhouse
  description: Basic OTel Collector distribution with Clickhouse Exporter
  output_path: ./otelcol-clickhouse
  otelcol_version: 0.164.0

extensions:
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.164.0
  - gomod:
      go.opentelemetry.io/collector/extension/memorylimiterextension v0.164.0

exporters:
  - gomod:
      go.opentelemetry.io/collector/exporter/debugexporter v0.164.0
  - gomod:
      go.opentelemetry.io/collector/exporter/otlpexporter v0.164.0
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter v0.164.0

processors:
  - gomod:
      go.opentelemetry.io/collector/processor/batchprocessor v0.164.0
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor v0.159.0

receivers:
  - gomod:
      go.opentelemetry.io/collector/receiver/otlpreceiver v0.164.0
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver v0.164.0
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/syslogreceiver v0.164.0

providers:
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/envprovider v1.65.0
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/fileprovider v1.65.0
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/httpprovider v1.65.0
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.65.0
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.65.0

replaces:
  - go.opentelemetry.io/collector => go.opentelemetry.io/collector v0.164.0
  - go.opentelemetry.io/collector/confmap => go.opentelemetry.io/collector/confmap v1.65.0
